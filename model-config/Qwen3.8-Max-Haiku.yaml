model_list:

  - model_name: qwen-primary
    litellm_params:
      model: openrouter/qwen/qwen3.8-max-0902
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4-5
      api_key: os.environ/OPENROUTER_API_KEY

  # Auto-router named "primary" — client always sends model: primary
  # Qwen3.8 Max handles text and images natively
  # Haiku 4.5 handles PDFs via complexity classification (no modality_routing)
  - model_name: primary
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: qwen-primary
          COMPLEX: haiku
        classification_mode: user_turn
      complexity_router_default_model: qwen-primary

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 10

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  default_model: primary
