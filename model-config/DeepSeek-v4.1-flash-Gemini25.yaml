model_list:

  - model_name: deepseek-text
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gemini-vision
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # Auto-router named "primary" — client always sends model: primary
  # LiteLLM routes text to DeepSeek, images and PDFs to Gemini automatically
  - model_name: primary
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: deepseek-text
          COMPLEX: gemini-vision
        modality_routing: true
        classification_mode: user_turn
      complexity_router_default_model: deepseek-text

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 10

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  default_model: primary
