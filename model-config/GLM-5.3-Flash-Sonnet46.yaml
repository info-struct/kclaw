model_list:

  - model_name: glm-primary
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-6
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: pdf-model
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-6
      api_key: os.environ/OPENROUTER_API_KEY

  # Auto-router named "primary" — client always sends model: primary
  # LiteLLM routes text/images to GLM-5.3-Flash, complex to Sonnet 4.6
  # pdf-model routes PDFs to Sonnet 4.6 (requires index-http-v2.ts code change)
  - model_name: primary
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: glm-primary
          COMPLEX: sonnet
        modality_routing: true
        classification_mode: user_turn
      complexity_router_default_model: glm-primary

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 10

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  default_model: primary
