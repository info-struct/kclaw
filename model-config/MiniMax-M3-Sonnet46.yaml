model_list:

  - model_name: minimax-text
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: claude-vision
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-6
      api_key: os.environ/OPENROUTER_API_KEY

  # Auto-router named "primary" — client always sends model: primary
  # LiteLLM routes text to MiniMax-M3, images and PDFs to Claude Sonnet 4.6 automatically
  - model_name: primary
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: minimax-text
          COMPLEX: claude-vision
        modality_routing: true
        classification_mode: user_turn
      complexity_router_default_model: minimax-text

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 10

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  default_model: primary
