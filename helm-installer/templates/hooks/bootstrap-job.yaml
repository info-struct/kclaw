---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kclaw-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
---
# Needs pods/exec to run the tenant bootstrap script inside the CredRouter pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kclaw-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kclaw-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: kclaw-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: kclaw-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
# post-install Job — runs once after all resources are created.
# Sequence:
#   1. Wait for LiteLLM readiness, generate a virtual API key
#   2. kubectl exec into CredRouter: init tenant DB (tenants + provider configs)
#   3. POST /admin/iam/bootstrap on CredRouter: create first admin user
#   4. POST /admin/tools/:tenantId on CredRouter: set Brave Search config (if key provided)
apiVersion: batch/v1
kind: Job
metadata:
  name: kclaw-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: kclaw-bootstrap
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: kclaw-bootstrap
    spec:
      restartPolicy: OnFailure
      {{- include "kclaw.nodeSelector" . | nindent 6 }}
      {{- include "kclaw.tolerations" . | nindent 6 }}
      serviceAccountName: kclaw-bootstrap
      initContainers:
        - name: wait-litellm
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for LiteLLM..."
              until curl -sf http://litellm.{{ .Release.Namespace }}.svc.cluster.local:4000/health/readiness; do
                sleep 5
              done
              echo "LiteLLM ready"
        - name: wait-credrouter
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for CredRouter..."
              until curl -sf http://credrouter.{{ .Release.Namespace }}.svc.cluster.local/health; do
                sleep 5
              done
              echo "CredRouter ready"
      containers:
        - name: bootstrap
          image: alpine/k8s:1.31.4
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: LITELLM_URL
              value: "http://litellm.{{ .Release.Namespace }}.svc.cluster.local:4000"
            - name: CREDROUTER_URL
              value: "http://credrouter.{{ .Release.Namespace }}.svc.cluster.local"
            - name: LITELLM_BASE_URL
              value: "http://litellm.{{ .Release.Namespace }}.svc.cluster.local:4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kclaw-secrets
                  key: ADMIN_TOKEN
            - name: ADMIN_EMAIL
              value: {{ required "admin.email is required" .Values.admin.email | quote }}
            - name: ADMIN_NAME
              value: {{ required "admin.name is required" .Values.admin.name | quote }}
            - name: SLACK_ENABLED
              value: {{ .Values.slack.enabled | toString | quote }}
            - name: TELEGRAM_ENABLED
              value: {{ .Values.telegram.enabled | toString | quote }}
            - name: BRAVE_SEARCH_API_KEY
              value: {{ .Values.braveSearch.apiKey | default "" | quote }}
            {{- if and (eq .Values.llm.provider "bedrock") .Values.llm.bedrock.anthropicFallbackKey }}
            - name: ANTHROPIC_FALLBACK_KEY
              value: {{ .Values.llm.bedrock.anthropicFallbackKey | quote }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          command:
            - sh
            - -c
            - |
              set -e

              # ── Step 1: Generate LiteLLM virtual key ──────────────────────────
              echo "==> Generating LiteLLM virtual key..."
              LITELLM_KEY=$(curl -sf -X POST "${LITELLM_URL}/key/generate" \
                -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
                -H "Content-Type: application/json" \
                -d '{"key_alias":"main"}' \
                | grep -o '"key":"[^"]*"' | cut -d'"' -f4)

              if [ -z "$LITELLM_KEY" ]; then
                echo "ERROR: Failed to generate LiteLLM virtual key"
                exit 1
              fi
              echo "LiteLLM virtual key generated"

              # ── Step 2: Bootstrap CredRouter tenants via kubectl exec ─────────
              echo "==> Finding CredRouter pod..."
              CREDROUTER_POD=$(kubectl get pods -n "${NAMESPACE}" \
                -l app=credrouter \
                -o jsonpath='{.items[0].metadata.name}')

              if [ -z "$CREDROUTER_POD" ]; then
                echo "ERROR: No CredRouter pod found"
                exit 1
              fi
              echo "CredRouter pod: ${CREDROUTER_POD}"

              echo "==> Copying bootstrap script to CredRouter pod..."
              kubectl cp /scripts/bootstrap.mjs \
                "${NAMESPACE}/${CREDROUTER_POD}:/tmp/bootstrap.mjs"

              echo "==> Running tenant bootstrap inside CredRouter..."
              kubectl exec -n "${NAMESPACE}" "${CREDROUTER_POD}" -- \
                env \
                  LITELLM_KEY="${LITELLM_KEY}" \
                  LITELLM_BASE_URL="${LITELLM_BASE_URL}" \
                  SLACK_ENABLED="${SLACK_ENABLED}" \
                  TELEGRAM_ENABLED="${TELEGRAM_ENABLED}" \
                  ANTHROPIC_FALLBACK_KEY="${ANTHROPIC_FALLBACK_KEY:-}" \
                node /tmp/bootstrap.mjs

              kubectl exec -n "${NAMESPACE}" "${CREDROUTER_POD}" -- \
                rm /tmp/bootstrap.mjs

              # ── Step 3: Create first admin user ───────────────────────────────
              echo "==> Creating admin user ${ADMIN_EMAIL}..."
              BOOTSTRAP_RESP=$(curl -sf -X POST "${CREDROUTER_URL}/admin/iam/bootstrap" \
                -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"email\":\"${ADMIN_EMAIL}\",\"name\":\"${ADMIN_NAME}\"}")

              TEMP_PASSWORD=$(echo "${BOOTSTRAP_RESP}" \
                | grep -o '"tempPassword":"[^"]*"' | cut -d'"' -f4)

              if [ -z "$TEMP_PASSWORD" ]; then
                echo "WARN: Could not extract temp password from response. Check CredRouter logs."
                echo "Response: ${BOOTSTRAP_RESP}"
              else
                echo "Admin user created. Temporary password: ${TEMP_PASSWORD}"
                echo "TEMP_PASSWORD=${TEMP_PASSWORD}" >> /tmp/bootstrap-summary
              fi

              # ── Step 4: Set Brave Search tool config ──────────────────────────
              if [ -n "${BRAVE_SEARCH_API_KEY}" ]; then
                echo "==> Setting Brave Search tool config..."
                for TENANT_ID in \
                  $([ "${SLACK_ENABLED}" = "true" ]    && echo "slack-main") \
                  $([ "${TELEGRAM_ENABLED}" = "true" ] && echo "telegram-main"); do
                  curl -sf -X POST \
                    "${CREDROUTER_URL}/admin/tools/${TENANT_ID}" \
                    -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "{\"toolName\":\"brave-search\",\"config\":{\"apiKey\":\"${BRAVE_SEARCH_API_KEY}\"}}"
                  echo "Brave Search configured for ${TENANT_ID}"
                done

                # Store as system default for future tenants provisioned via Admin UI
                curl -sf -X POST "${CREDROUTER_URL}/admin/settings" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"key\":\"tool_default_brave-search\",\"value\":\"${BRAVE_SEARCH_API_KEY}\"}" \
                  || echo "WARN: Could not store brave-search system default"
              fi

              echo "==> Bootstrap complete."
              echo ""
              echo "  Admin email:    ${ADMIN_EMAIL}"
              [ -n "${TEMP_PASSWORD}" ] && echo "  Temp password:  ${TEMP_PASSWORD}"
              echo ""
              echo "Change your password on first login."
      volumes:
        - name: scripts
          configMap:
            name: kclaw-bootstrap-script
