{{- $existing := lookup "v1" "Secret" .Release.Namespace "kclaw-generated-secrets" -}}

{{- $encKey := randBytes 32 | b64enc -}}
{{- $jwtSec := randAlphaNum 48 -}}
{{- $admTok := randAlphaNum 32 -}}
{{- $litKey := printf "sk-litellm-%s" (randAlphaNum 24) -}}
{{- $pgPass := randAlphaNum 24 -}}

{{- if $existing -}}
  {{- if hasKey $existing.data "encryption-key" -}}{{- $encKey = index $existing.data "encryption-key" | b64dec -}}{{- end -}}
  {{- if hasKey $existing.data "jwt-secret"     -}}{{- $jwtSec = index $existing.data "jwt-secret"     | b64dec -}}{{- end -}}
  {{- if hasKey $existing.data "admin-token"    -}}{{- $admTok = index $existing.data "admin-token"    | b64dec -}}{{- end -}}
  {{- if hasKey $existing.data "litellm-key"    -}}{{- $litKey = index $existing.data "litellm-key"    | b64dec -}}{{- end -}}
  {{- if hasKey $existing.data "pg-password"    -}}{{- $pgPass = index $existing.data "pg-password"    | b64dec -}}{{- end -}}
{{- end -}}

{{- if .Values.secrets.encryptionKey    -}}{{- $encKey = .Values.secrets.encryptionKey    -}}{{- end -}}
{{- if .Values.secrets.jwtSecret        -}}{{- $jwtSec = .Values.secrets.jwtSecret        -}}{{- end -}}
{{- if .Values.secrets.adminToken       -}}{{- $admTok = .Values.secrets.adminToken       -}}{{- end -}}
{{- if .Values.secrets.litellmMasterKey -}}{{- $litKey = .Values.secrets.litellmMasterKey -}}{{- end -}}
{{- if .Values.secrets.postgresPassword -}}{{- $pgPass = .Values.secrets.postgresPassword -}}{{- end -}}

{{- $pgHost := include "kclaw.postgresHost" . -}}
---
# Stores all auto-generated secrets. Looked up on upgrade so values never change.
apiVersion: v1
kind: Secret
metadata:
  name: kclaw-generated-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  encryption-key: {{ $encKey | quote }}
  jwt-secret: {{ $jwtSec | quote }}
  admin-token: {{ $admTok | quote }}
  litellm-key: {{ $litKey | quote }}
  pg-password: {{ $pgPass | quote }}
  postgres-password: {{ $pgPass | quote }}
---
# KClaw component secrets — sourced from the generated values above.
apiVersion: v1
kind: Secret
metadata:
  name: kclaw-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  CREDROUTER_ENCRYPTION_KEY: {{ $encKey | quote }}
  CREDROUTER_JWT_SECRET: {{ $jwtSec | quote }}
  ADMIN_TOKEN: {{ $admTok | quote }}
  JWT_SECRET: {{ $jwtSec | quote }}
  SLACK_BOT_TOKEN: {{ .Values.slack.botToken | default "" | quote }}
  SLACK_APP_TOKEN: {{ .Values.slack.appToken | default "" | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.telegram.botToken | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.openai.apiKey | default "" | quote }}
---
# Channel token .env file — mounted at /app/.env in the orchestrator and task-executor.
apiVersion: v1
kind: Secret
metadata:
  name: kclaw-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  ".env": |
    SLACK_BOT_TOKEN={{ .Values.slack.botToken | default "" }}
    SLACK_APP_TOKEN={{ .Values.slack.appToken | default "" }}
    TELEGRAM_BOT_TOKEN={{ .Values.telegram.botToken | default "" }}
    OPENAI_API_KEY={{ .Values.openai.apiKey | default "" }}
---
# LiteLLM secrets — provider credentials + master key + database URL.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ $litKey | quote }}
  DATABASE_URL: {{ printf "postgresql://postgres:%s@%s:5432/litellm" $pgPass $pgHost | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  ANTHROPIC_API_KEY: {{ required "llm.anthropic.apiKey is required when provider is anthropic" .Values.llm.anthropic.apiKey | quote }}
  {{- else if eq .Values.llm.provider "bedrock" }}
  AWS_ACCESS_KEY_ID: {{ required "llm.bedrock.accessKeyId is required" .Values.llm.bedrock.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "llm.bedrock.secretAccessKey is required" .Values.llm.bedrock.secretAccessKey | quote }}
  AWS_REGION_NAME: {{ .Values.llm.bedrock.region | default "us-east-1" | quote }}
  {{- if .Values.llm.bedrock.anthropicFallbackKey }}
  ANTHROPIC_API_KEY: {{ .Values.llm.bedrock.anthropicFallbackKey | quote }}
  {{- end }}
  {{- else if eq .Values.llm.provider "openrouter" }}
  OPENROUTER_API_KEY: {{ required "llm.openrouter.apiKey is required when provider is openrouter" .Values.llm.openrouter.apiKey | quote }}
  {{- end }}
