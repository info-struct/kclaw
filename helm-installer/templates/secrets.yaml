{{- $s := fromYaml (include "kclaw.secrets" .) -}}
---
# Stores all auto-generated secrets. Looked up on upgrade so values never change.
apiVersion: v1
kind: Secret
metadata:
  name: kclaw-generated-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  encryption-key: {{ $s.encryptionKey | quote }}
  jwt-secret:     {{ $s.jwtSecret     | quote }}
  admin-token:    {{ $s.adminToken    | quote }}
  litellm-key:    {{ $s.litellmKey    | quote }}
  pg-password:    {{ $s.pgPassword    | quote }}
---
# KClaw component secrets — sourced from kclaw-generated-secrets above.
apiVersion: v1
kind: Secret
metadata:
  name: kclaw-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  CREDROUTER_ENCRYPTION_KEY: {{ $s.encryptionKey | quote }}
  CREDROUTER_JWT_SECRET:     {{ $s.jwtSecret     | quote }}
  ADMIN_TOKEN:               {{ $s.adminToken    | quote }}
  JWT_SECRET:                {{ $s.jwtSecret     | quote }}
  SLACK_BOT_TOKEN:   {{ .Values.slack.botToken   | default "" | quote }}
  SLACK_APP_TOKEN:   {{ .Values.slack.appToken   | default "" | quote }}
  TELEGRAM_BOT_TOKEN:{{ .Values.telegram.botToken | default "" | quote }}
  OPENAI_API_KEY:    {{ .Values.openai.apiKey    | default "" | quote }}
---
# LiteLLM secrets — provider credentials + master key + database URL.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ $s.litellmKey | quote }}
  DATABASE_URL: {{ printf "postgresql://postgres:%s@%s:5432/litellm" $s.pgPassword (include "kclaw.postgresHost" .) | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  ANTHROPIC_API_KEY: {{ required "llm.anthropic.apiKey is required when provider is anthropic" .Values.llm.anthropic.apiKey | quote }}
  {{- else if eq .Values.llm.provider "bedrock" }}
  AWS_ACCESS_KEY_ID:     {{ required "llm.bedrock.accessKeyId is required"     .Values.llm.bedrock.accessKeyId     | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "llm.bedrock.secretAccessKey is required" .Values.llm.bedrock.secretAccessKey | quote }}
  AWS_REGION_NAME:       {{ .Values.llm.bedrock.region | default "us-east-1"   | quote }}
  {{- if .Values.llm.bedrock.anthropicFallbackKey }}
  ANTHROPIC_API_KEY: {{ .Values.llm.bedrock.anthropicFallbackKey | quote }}
  {{- end }}
  {{- else if eq .Values.llm.provider "openrouter" }}
  OPENROUTER_API_KEY: {{ required "llm.openrouter.apiKey is required when provider is openrouter" .Values.llm.openrouter.apiKey | quote }}
  {{- end }}
