---
apiVersion: v1
kind: Service
metadata:
  name: credrouter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: credrouter
    component: credential-router
spec:
  type: ClusterIP
  # Sticky sessions — keeps a given client on the same pod replica.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300
  selector:
    app: credrouter
    component: credential-router
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
