---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: credrouter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: credrouter
    component: credential-router
---
# ClusterRole — TokenReview + read service accounts/pods/PVCs + metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-credrouter
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: credrouter
    component: credential-router
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-credrouter
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: credrouter
    component: credential-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-credrouter
subjects:
  - kind: ServiceAccount
    name: credrouter
    namespace: {{ .Release.Namespace }}
