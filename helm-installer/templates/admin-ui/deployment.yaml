---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kclaw-admin-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: kclaw-admin-ui
    component: admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kclaw-admin-ui
      component: admin-ui
  template:
    metadata:
      labels:
        {{- include "kclaw.labels" . | nindent 8 }}
        app: kclaw-admin-ui
        component: admin-ui
    spec:
      {{- include "kclaw.imagePullSecrets" . | nindent 6 }}
      {{- include "kclaw.nodeSelector" . | nindent 6 }}
      {{- include "kclaw.tolerations" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: kclaw-admin-ui
          image: {{ .Values.images.adminUI | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            - name: PORT
              value: "3003"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: CREDROUTER_URL
              value: {{ include "kclaw.credRouterURL" . | quote }}
            - name: ORCHESTRATOR_ADMIN_URL
              value: {{ include "kclaw.orchestratorAdminURL" . | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.ingress.cookieSecure | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kclaw-secrets
                  key: JWT_SECRET
            - name: CREDROUTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kclaw-secrets
                  key: ADMIN_TOKEN
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
