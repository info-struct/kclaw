---
apiVersion: v1
kind: Service
metadata:
  name: kclaw-admin-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: kclaw-admin-ui
    component: admin-ui
spec:
  type: ClusterIP
  selector:
    app: kclaw-admin-ui
    component: admin-ui
  ports:
    - name: http
      port: 3003
      targetPort: http
      protocol: TCP
