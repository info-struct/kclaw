{{- if .Values.ingress.adminUI.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kclaw-admin-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
  {{- with .Values.ingress.adminUI.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.adminUI.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kclaw-admin-ui
                port:
                  number: 3003
  {{- with .Values.ingress.adminUI.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
