---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclaw-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
    app: kubeclaw
    component: orchestrator
---
# Namespace-scoped Role — create/manage agent pods, services, and batch jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeclaw-job-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeclaw-orchestrator-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kclaw.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: kubeclaw-orchestrator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: kubeclaw-job-manager
  apiGroup: rbac.authorization.k8s.io
