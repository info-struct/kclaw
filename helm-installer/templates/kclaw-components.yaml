# TODO: Port the following templates from kclaw-installer/helm/templates/
# adjusting values references to match this chart's simplified values schema.
#
# Templates to port:
#   credrouter/deployment.yaml   — update image ref to .Values.images.credrouter
#   credrouter/service.yaml      — no changes needed
#   credrouter/rbac.yaml         — no changes needed
#   credrouter/pvc.yaml          — update storageClass to .Values.storageClass
#   orchestrator/deployment.yaml — update image ref, hostPath, assistantName, nodeSelector
#   orchestrator/services.yaml   — no changes needed
#   orchestrator/ingress.yaml    — update ingressClassName to .Values.ingress.className
#   orchestrator/rbac.yaml       — no changes needed
#   admin-ui/deployment.yaml     — update image ref, cookieSecure, nodeSelector
#   admin-ui/service.yaml        — update serviceType to .Values.adminUI.serviceType (default ClusterIP)
#   admin-ui/ingress.yaml        — update ingressClassName, host, tls from .Values.ingress.adminUI
#   task-executor/cronjob.yaml   — update image ref, nodeSelector
#
# The values path mapping for the most common overrides:
#
#   Installer chart path                    → This chart path
#   credrouter.nodeSelector                 → built into kclaw.nodeSelector helper
#   credrouter.persistence.storageClassName → .Values.storageClass
#   orchestrator.nodeSelector               → built into kclaw.nodeSelector helper
#   orchestrator.hostPath                   → .Values.workspacePath
#   orchestrator.assistantName              → .Values.llm.assistantName
#   adminUI.nodeSelector                    → built into kclaw.nodeSelector helper
#   adminUI.serviceType                     → ClusterIP (ingress handles external access)
#   adminUI.cookieSecure                    → .Values.ingress.cookieSecure
#   adminUI.ingress.ingressClassName        → .Values.ingress.className
#   adminUI.ingress.hosts[0]                → .Values.ingress.adminUI.host
#   adminApiIngress.ingressClassName        → .Values.ingress.className
#   adminApiIngress.hosts[0]                → .Values.ingress.adminApi.host
#   secrets.credrouter.encryptionKey        → from kclaw-secrets Secret (env injection)
#   secrets.credrouter.jwtSecret            → from kclaw-secrets Secret (env injection)
#   secrets.adminUiSecrets.jwtSecret        → from kclaw-secrets Secret (env injection)
#   secrets.adminUiSecrets.credRouterAdminToken → from kclaw-secrets Secret (env injection)
#   secrets.channelTokens.*                 → from kclaw-secrets Secret (env injection)
